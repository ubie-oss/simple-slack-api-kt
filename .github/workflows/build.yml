name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # ratchet:actions/checkout@v2

      - name: Cache multiple paths
        uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # ratchet:actions/cache@v2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ hashFiles('*.gradle.kts') }}-${{ hashFiles('gradle.properties') }}

      - name: Set up JDK 8
        uses: actions/setup-java@91d3aa4956ec4a53e477c4907347b5e3481be8c9 # ratchet:actions/setup-java@v2
        with:
          java-version: '8'
          distribution: 'adopt'

      - name: Lint with Gradle
        run: ./gradlew ktlintCheck

      - name: Build with Gradle
        run: ./gradlew build

      - name: Test with Gradle
        run: ./gradlew test jacocoTestReport --no-daemon --max-workers 2
